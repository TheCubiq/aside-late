# A changed patch has to raise its version, or Mods never offers the change to anyone.
name: Patch versions

on:
  push:
    branches: [main]
    paths: ["patches/**"]
  pull_request:
    paths: ["patches/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: python3 .github/check-patch-versions.py "$BASE" "$GITHUB_SHA"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
