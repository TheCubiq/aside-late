<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>heya!</title>
<style>
  :root {
    color-scheme: dark;
    --page: #0b0b0d;
    --card: #17171a;
    --line: rgb(255 255 255 / 0.08);
    --text: #f4f4f5;
    --muted: #a1a1aa;
    --button: #f4f4f5;
    --button-text: #0b0b0d;
    --ghost: rgb(255 255 255 / 0.06);
    --ink: #1d9bf0;
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --page: #e9e9ec;
      --card: #ffffff;
      --line: rgb(0 0 0 / 0.08);
      --text: #18181b;
      --muted: #52525b;
      --button: #18181b;
      --button-text: #ffffff;
      --ghost: rgb(0 0 0 / 0.05);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    overflow: hidden;
    display: grid;
    place-items: center;
    padding: 16px;
    /* The plain colour underneath matters: without one, Aside shows nothing of the page at all. */
    background: radial-gradient(120% 90% at 50% 40%, color-mix(in srgb, var(--page) 94%, var(--ink) 6%), var(--page)) var(--page);
    color: var(--text);
    font: 15px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    position: relative;
    width: min(440px, 100%);
    padding: 28px;
    border: 1px solid var(--line);
    border-radius: 20px;
    background: var(--card);
    box-shadow: 0 24px 60px rgb(0 0 0 / 0.35), 0 2px 8px rgb(0 0 0 / 0.2);
  }
  /* Only once the tab is really on screen. A tab opened at startup starts hidden, and an animation waiting there would leave the card invisible. */
  .card.enter { animation: pop 420ms cubic-bezier(0.2, 1.4, 0.4, 1); }
  @keyframes pop { from { opacity: 0; transform: translateY(12px) scale(0.96); } }
  h1 { margin: 0 0 8px; font-size: 26px; line-height: 1.2; font-weight: 650; letter-spacing: -0.01em; text-wrap: balance; }
  p { margin: 0; color: var(--muted); text-wrap: pretty; }
  .buttons { display: flex; gap: 10px; margin-top: 22px; }
  .buttons a {
    flex: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 42px;
    padding: 0 14px;
    border-radius: 12px;
    background: var(--button);
    color: var(--button-text);
    font-weight: 600;
    text-decoration: none;
    white-space: nowrap;
    transition: transform 120ms ease, opacity 120ms ease;
  }
  .buttons a:active { transform: scale(0.97); }
  .buttons a:focus-visible, .later:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .buttons svg { width: 17px; height: 17px; flex: none; fill: currentColor; }
  .buttons a.done { opacity: 0.55; }
  .later {
    display: block;
    margin: 12px auto 0;
    padding: 8px 14px;
    border: 0;
    border-radius: 10px;
    background: none;
    color: var(--muted);
    font: inherit;
    cursor: pointer;
  }
  .later:hover { background: var(--ghost); color: var(--text); }
  .promise { margin-top: 14px; font-size: 12px; text-align: center; color: color-mix(in srgb, var(--muted) 75%, transparent); }
  @media (max-width: 420px) { .buttons { flex-direction: column; } }

  /* The hand and its scribbles sit over everything, and never take a click. */
  .ink, .hand { position: fixed; inset: 0; pointer-events: none; }
  .ink { width: 100%; height: 100%; }
  .ink path { fill: none; stroke: var(--ink); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; transition: opacity 400ms ease; }
  .hand { inset: auto; left: 0; top: 0; will-change: transform; }
  .hand svg { position: absolute; left: -64px; top: -6px; overflow: visible; filter: drop-shadow(0 6px 10px rgb(0 0 0 / 0.35)); }
</style>
</head>
<body>
  <main class="card" role="dialog" aria-labelledby="title" aria-describedby="about">
    <h1 id="title">heya, thanks for using my patch stuff thing</h1>
    <p id="about">I made it for fun, and it's free. If it made your Aside a little nicer, a star or a follow would make my day.</p>
    <div class="buttons">
      <a id="star" href="https://github.com/TheCubiq/aside-late" target="_blank" rel="noopener">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        Star on GitHub
      </a>
      <a id="follow" href="https://x.com/CubiqNation" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        Follow @CubiqNation
      </a>
    </div>
    <button class="later" id="later" type="button">nah, maybe later</button>
    <div class="promise">You'll only see this once. Pinky promise.</div>
  </main>

  <svg class="ink" aria-hidden="true"><path id="scribble" opacity="0"/></svg>

  <div class="hand" id="hand" aria-hidden="true">
    <!-- Points straight up, with the fingertip at (64, 6). The page turns it. -->
    <svg width="128" height="1400" viewBox="-64 -6 128 1400">
      <defs>
        <radialGradient id="glove" cx="0.38" cy="0.3" r="0.9">
          <stop offset="0" stop-color="#ffffff"/>
          <stop offset="0.55" stop-color="#f6f6f8"/>
          <stop offset="1" stop-color="#d6d6de"/>
        </radialGradient>
        <linearGradient id="stick" x1="0" x2="1">
          <stop offset="0" stop-color="#3a3a3e"/>
          <stop offset="0.45" stop-color="#1c1c1f"/>
          <stop offset="1" stop-color="#0d0d0f"/>
        </linearGradient>
      </defs>
      <g stroke="#1d1d21" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
        <rect x="13" y="132" width="20" height="1300" rx="10" fill="url(#stick)" stroke="none"/>
        <path d="M-3 118 C-6 130 -9 140 -8 147 C-6 156 52 158 56 149 C58 142 54 130 51 118 Z" fill="url(#glove)"/>
        <path d="M-6 133 C10 137 37 137 53 133" fill="none" stroke-width="2.5"/>
        <path d="M0 -1 C7 -1 12 4 13 13 C14 24 14 34 13 44 C16 36 26 37 30 45 C36 39 46 43 48 51
                 C56 49 62 57 60 67 C64 77 65 89 62 101 C58 117 42 125 22 125 C4 125 -13 120 -19 110 C-26 100 -28 86 -24 78
                 C-21 71 -14 69 -13 60 C-13 44 -13 26 -12 13 C-12 4 -7 -1 0 -1 Z" fill="url(#glove)"/>
        <path d="M13.5 47 C14 51 14 54 12 58" fill="none" stroke-width="2.5"/>
        <path d="M30 45 C32 53 32 59 30 63 M48 51 C50 59 48 65 46 69" fill="none" stroke-width="2.5"/>
        <path d="M-6 6 C-3 3 3 3 6 6" fill="none" stroke="#c8c8d0" stroke-width="2"/>
        <path d="M17 80 L20 103 M30 78 L33 101 M43 76 L46 99" fill="none" stroke="#111" stroke-width="5.5"/>
      </g>
    </svg>
  </div>

  <script type="module" src="/aside-late/hello.js"></script>
</body>
</html>
